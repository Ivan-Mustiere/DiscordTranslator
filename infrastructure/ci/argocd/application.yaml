apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: discord-translator-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/imustiere/DiscordTranslator.git
    targetRevision: HEAD
    path: infrastructure/k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: discord-translator-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
