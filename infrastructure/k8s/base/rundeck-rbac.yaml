apiVersion: v1
kind: ServiceAccount
metadata:
  name: rundeck-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rundeck-operator-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rundeck-operator-binding
subjects:
  - kind: ServiceAccount
    name: rundeck-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rundeck-operator-role
