apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-engine
  template:
    metadata:
      labels:
        app: asr-engine
    spec:
      containers:
        - name: asr-engine
          image: ghcr.io/imustiere/discordtranslator-asr-engine:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: asr-engine
spec:
  selector:
    app: asr-engine
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
